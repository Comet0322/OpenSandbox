{{/*
Shared configuration: the artifact store pointer and the runtime
environment definitions. Mirrors fast-sandbox config/artifact-store and
config/runtime-environments at the pinned commit.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fast-sandbox-artifact-store
  namespace: {{ include "fast-sandbox.namespace" . }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  store: {{ .Values.artifactStore.store | quote }}
  endpoint: {{ .Values.artifactStore.endpoint | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fast-sandbox-runtime-environments
  namespace: {{ include "fast-sandbox.namespace" . }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  runtime-environments.yaml: |
    {{- .Values.runtimeEnvironments | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fast-sandbox-builder-pod-template
  namespace: {{ include "fast-sandbox.namespace" . }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
{{- with .Values.controller.sandboxtemplateBuilderPodSpec }}
data:
  podSpec.yaml: |
    {{- . | nindent 4 }}
{{- end }}
{{- if and .Values.routeKeys.create (not .Values.routeKeys.existingSecret) }}
{{- $keyHelp := "set routeKeys.existingSecret, or routeKeys.privateKey and routeKeys.publicKey (see the chart README for how to generate them)" }}
{{- if not (and .Values.routeKeys.privateKey .Values.routeKeys.publicKey) }}
{{- fail (printf "fast-sandbox: no route keys configured; %s" $keyHelp) }}
{{- end }}
{{- if or (eq .Values.routeKeys.privateKey "nWGxne/9WmC6hEr0kuwsxERJxWl7MmkZcDusAxyuf2A=") (eq .Values.routeKeys.publicKey "11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=") }}
{{- fail (printf "fast-sandbox: routeKeys uses the published RFC 8032 test keypair, which is not allowed; %s" $keyHelp) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: fast-sandbox-route-keys
  namespace: {{ include "fast-sandbox.namespace" . }}
  labels:
    {{- include "fast-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
type: Opaque
stringData:
  private-key: {{ .Values.routeKeys.privateKey | quote }}
  public-key: {{ .Values.routeKeys.publicKey | quote }}
{{- end }}
